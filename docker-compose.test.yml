services:
  frontend:
    image: ${DOCKERHUB_USER}/frontend:${IMAGE_TAG}
    ports:
      - "80:80"
    depends_on:
      - calc-api
      - history-api

  calc-api:
    image: ${DOCKERHUB_USER}/calc-api:${IMAGE_TAG}
    ports:
      - "3001:3001"

  history-api:
    image: ${DOCKERHUB_USER}/history-api:${IMAGE_TAG}
    ports:
      - "3002:3002"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: calculator
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calculator
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
