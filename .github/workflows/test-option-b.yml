name: Test Pipeline — Option B

on:
  push:
    branches: [test]
    paths:
      - 'optionB/**'
      - '.github/workflows/test-option-b.yml'

concurrency:
  group: test-pipeline-option-b
  cancel-in-progress: true

env:
  IMAGE_TAG: test-${{ github.sha }}
  AWS_REGION: us-east-1

jobs:

  # ── integration tests + CVE scan + retag ──────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Start full stack
        run: docker compose -f optionB/docker-compose.test.yml up -d
        env:
          FRONTEND_REPO_URL: ${{ secrets.FRONTEND_REPO_URL }}
          CALC_API_REPO_URL: ${{ secrets.CALC_API_REPO_URL }}
          HISTORY_API_REPO_URL: ${{ secrets.HISTORY_API_REPO_URL }}

      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/health && curl -sf http://localhost:5000/health; then
              echo "All services healthy"
              exit 0
            fi
            echo "Attempt $i — waiting 5s..."
            sleep 5
          done
          echo "Services did not become healthy"
          exit 1

      - name: Test calc-api — assert correct result
        run: |
          RESULT=$(curl -sf -X POST http://localhost:3000/calculate \
            -H "Content-Type: application/json" \
            -d '{"a": 2, "b": 3, "operation": "+"}')
          echo "Response: $RESULT"
          [ "$(echo "$RESULT" | jq -r '.result')" = "5" ] \
            || (echo "Expected result=5, got: $RESULT" && exit 1)
          [ "$(echo "$RESULT" | jq -r '.expression')" = "2 + 3" ] \
            || (echo "Expected expression='2 + 3', got: $RESULT" && exit 1)
          echo "calc-api: OK"

      - name: Test history-api — save and retrieve
        run: |
          POST=$(curl -sf -X POST http://localhost:5000/history \
            -H "Content-Type: application/json" \
            -d '{"expression": "2 + 3", "result": 5}')
          echo "POST response: $POST"
          [ "$(echo "$POST" | jq -r '.id')" != "null" ] \
            || (echo "Expected id in POST response, got: $POST" && exit 1)

          HISTORY=$(curl -sf http://localhost:5000/history)
          echo "GET response: $HISTORY"
          [ "$(echo "$HISTORY" | jq -r '.[0].expression')" = "2 + 3" ] \
            || (echo "Expected saved entry in history, got: $HISTORY" && exit 1)
          echo "history-api: OK"

      - name: Tear down stack
        if: always()
        run: docker compose -f optionB/docker-compose.test.yml down
        env:
          FRONTEND_REPO_URL: ${{ secrets.FRONTEND_REPO_URL }}
          CALC_API_REPO_URL: ${{ secrets.CALC_API_REPO_URL }}
          HISTORY_API_REPO_URL: ${{ secrets.HISTORY_API_REPO_URL }}

      - name: Scan calc-api image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.CALC_API_REPO_URL }}:dev-latest
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan history-api image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.HISTORY_API_REPO_URL }}:dev-latest
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan frontend image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.FRONTEND_REPO_URL }}:dev-latest
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Retag images as test
        run: |
          docker tag ${{ secrets.FRONTEND_REPO_URL }}:dev-latest \
                     ${{ secrets.FRONTEND_REPO_URL }}:${{ env.IMAGE_TAG }}
          docker tag ${{ secrets.FRONTEND_REPO_URL }}:dev-latest \
                     ${{ secrets.FRONTEND_REPO_URL }}:test-latest
          docker tag ${{ secrets.CALC_API_REPO_URL }}:dev-latest \
                     ${{ secrets.CALC_API_REPO_URL }}:${{ env.IMAGE_TAG }}
          docker tag ${{ secrets.CALC_API_REPO_URL }}:dev-latest \
                     ${{ secrets.CALC_API_REPO_URL }}:test-latest
          docker tag ${{ secrets.HISTORY_API_REPO_URL }}:dev-latest \
                     ${{ secrets.HISTORY_API_REPO_URL }}:${{ env.IMAGE_TAG }}
          docker tag ${{ secrets.HISTORY_API_REPO_URL }}:dev-latest \
                     ${{ secrets.HISTORY_API_REPO_URL }}:test-latest

      - name: Push test-tagged images to ECR
        run: |
          docker push ${{ secrets.FRONTEND_REPO_URL }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.FRONTEND_REPO_URL }}:test-latest
          docker push ${{ secrets.CALC_API_REPO_URL }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.CALC_API_REPO_URL }}:test-latest
          docker push ${{ secrets.HISTORY_API_REPO_URL }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.HISTORY_API_REPO_URL }}:test-latest

  # ── open automated PR: test → prod ─────────────────────────────────────────
  open-pr:
    name: Open PR test → prod
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create PR test → prod
        run: |
          gh pr create \
            --base prod \
            --head test \
            --title "ci: promote test → prod (${{ env.IMAGE_TAG }})" \
            --body "Automated promotion from test. Images tagged ${{ env.IMAGE_TAG }}." \
            || echo "PR already exists or no diff — skipping"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
