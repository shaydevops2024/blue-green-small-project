name: Prod Pipeline

on:
  push:
    branches: [prod]

concurrency:
  group: prod-pipeline
  cancel-in-progress: false

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  deploy:
    name: Blue/Green Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Find which target group is currently live on the listener
      - name: Determine active / standby slot
        id: slot
        run: |
          CURRENT_TG=$(aws elbv2 describe-listeners \
            --listener-arns "${{ secrets.LISTENER_ARN }}" \
            --query 'Listeners[0].DefaultActions[0].TargetGroupArn' \
            --output text)

          if [ "$CURRENT_TG" = "${{ secrets.BLUE_TG_ARN }}" ]; then
            echo "active=blue"                                          >> $GITHUB_OUTPUT
            echo "standby=green"                                        >> $GITHUB_OUTPUT
            echo "standby_id=${{ secrets.GREEN_INSTANCE_ID }}"         >> $GITHUB_OUTPUT
            echo "standby_tg=${{ secrets.GREEN_TG_ARN }}"              >> $GITHUB_OUTPUT
          else
            echo "active=green"                                         >> $GITHUB_OUTPUT
            echo "standby=blue"                                         >> $GITHUB_OUTPUT
            echo "standby_id=${{ secrets.BLUE_INSTANCE_ID }}"          >> $GITHUB_OUTPUT
            echo "standby_tg=${{ secrets.BLUE_TG_ARN }}"               >> $GITHUB_OUTPUT
          fi

      - name: Deploy on standby (${{ steps.slot.outputs.standby }}) via SSM
        env:
          STANDBY_ID: ${{ steps.slot.outputs.standby_id }}
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Encode the compose file so it survives being passed through jq/SSM
          COMPOSE_B64=$(base64 -w0 docker-compose.prod.yml)

          SCRIPT=$(cat << 'SCRIPT_EOF'
          set -e
          . /etc/profile.d/slot.sh
          printf '%s' 'COMPOSE_PLACEHOLDER' | base64 -d > /home/ec2-user/docker-compose.prod.yml
          printf '%s' 'TOKEN_PLACEHOLDER' | docker login -u 'USER_PLACEHOLDER' --password-stdin
          DOCKERHUB_USER='USER_PLACEHOLDER' IMAGE_TAG=test-latest docker compose -f /home/ec2-user/docker-compose.prod.yml pull
          DOCKERHUB_USER='USER_PLACEHOLDER' IMAGE_TAG=test-latest docker compose -f /home/ec2-user/docker-compose.prod.yml up -d
          SCRIPT_EOF
          )
          SCRIPT="${SCRIPT//COMPOSE_PLACEHOLDER/$COMPOSE_B64}"
          SCRIPT="${SCRIPT//USER_PLACEHOLDER/$DH_USER}"
          SCRIPT="${SCRIPT//TOKEN_PLACEHOLDER/$DH_TOKEN}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$STANDBY_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n --arg cmd "$SCRIPT" '{"commands": [$cmd]}')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$STANDBY_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i — $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded"
              exit 0
            fi
            if [[ "$STATUS" =~ ^(Failed|TimedOut|Cancelled)$ ]]; then
              echo "--- Command Output ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$STANDBY_ID" \
                --query '[StandardOutputContent, StandardErrorContent]' \
                --output text
              exit 1
            fi
            sleep 10
          done
          echo "SSM deploy timed out"
          exit 1

      # Poll ALB target health — healthier signal than curling the instance directly
      - name: Wait for standby to be healthy in ALB
        run: |
          for i in $(seq 1 18); do
            STATE=$(aws elbv2 describe-target-health \
              --target-group-arn "${{ steps.slot.outputs.standby_tg }}" \
              --query 'TargetHealthDescriptions[0].TargetHealth.State' \
              --output text)
            echo "Attempt $i — target health: $STATE"
            [ "$STATE" = "healthy" ] && echo "Standby is healthy" && exit 0
            sleep 10
          done
          echo "Standby did not become healthy in time"
          exit 1

      - name: Switch ALB → ${{ steps.slot.outputs.standby }}
        run: |
          aws elbv2 modify-listener \
            --listener-arn "${{ secrets.LISTENER_ARN }}" \
            --default-actions "Type=forward,TargetGroupArn=${{ steps.slot.outputs.standby_tg }}"
          echo "Traffic switched: ${{ steps.slot.outputs.active }} → ${{ steps.slot.outputs.standby }}"
