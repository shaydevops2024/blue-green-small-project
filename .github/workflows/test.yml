name: Test Pipeline

on:
  push:
    branches: [test]

concurrency:
  group: test-pipeline
  cancel-in-progress: true

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: test-${{ github.sha }}

jobs:

  # ── integration tests ──────────────────────────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start full stack
        run: docker compose -f docker-compose.test.yml up -d
        env:
          DOCKERHUB_USER: ${{ env.DOCKERHUB_USER }}
          IMAGE_TAG: dev-latest
      - name: Wait for services to be healthy
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3001/health && curl -sf http://localhost:3002/health; then
              echo "All services healthy"
              exit 0
            fi
            echo "Attempt $i — waiting 5s..."
            sleep 5
          done
          echo "Services did not become healthy"
          exit 1

      - name: Test calc-api — assert correct result
        run: |
          RESULT=$(curl -sf -X POST http://localhost:3001/calculate \
            -H "Content-Type: application/json" \
            -d '{"a": 2, "b": 3, "operation": "+"}')
          echo "Response: $RESULT"
          [ "$(echo "$RESULT" | jq -r '.result')" = "5" ] \
            || (echo "Expected result=5, got: $RESULT" && exit 1)
          [ "$(echo "$RESULT" | jq -r '.expression')" = "2 + 3" ] \
            || (echo "Expected expression='2 + 3', got: $RESULT" && exit 1)
          echo "calc-api: OK"

      - name: Test history-api — save and retrieve
        run: |
          POST=$(curl -sf -X POST http://localhost:3002/history \
            -H "Content-Type: application/json" \
            -d '{"expression": "2 + 3", "result": 5}')
          echo "POST response: $POST"
          [ "$(echo "$POST" | jq -r '.id')" != "null" ] \
            || (echo "Expected id in POST response, got: $POST" && exit 1)

          HISTORY=$(curl -sf http://localhost:3002/history)
          echo "GET response: $HISTORY"
          [ "$(echo "$HISTORY" | jq -r '.[0].expression')" = "2 + 3" ] \
            || (echo "Expected saved entry in history, got: $HISTORY" && exit 1)
          echo "history-api: OK"

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Scan calc-api image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USER }}/calc-api:dev-latest
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan history-api image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USER }}/history-api:dev-latest
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan frontend image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USER }}/frontend:dev-latest
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Retag images as test
        run: |
          docker tag ${{ env.DOCKERHUB_USER }}/frontend:dev-latest \
                     ${{ env.DOCKERHUB_USER }}/frontend:${{ env.IMAGE_TAG }}
          docker tag ${{ env.DOCKERHUB_USER }}/frontend:dev-latest \
                     ${{ env.DOCKERHUB_USER }}/frontend:test-latest
          docker tag ${{ env.DOCKERHUB_USER }}/calc-api:dev-latest \
                     ${{ env.DOCKERHUB_USER }}/calc-api:${{ env.IMAGE_TAG }}
          docker tag ${{ env.DOCKERHUB_USER }}/calc-api:dev-latest \
                     ${{ env.DOCKERHUB_USER }}/calc-api:test-latest
          docker tag ${{ env.DOCKERHUB_USER }}/history-api:dev-latest \
                     ${{ env.DOCKERHUB_USER }}/history-api:${{ env.IMAGE_TAG }}
          docker tag ${{ env.DOCKERHUB_USER }}/history-api:dev-latest \
                     ${{ env.DOCKERHUB_USER }}/history-api:test-latest

      - name: Push test-tagged images
        run: |
          docker push ${{ env.DOCKERHUB_USER }}/frontend:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USER }}/frontend:test-latest
          docker push ${{ env.DOCKERHUB_USER }}/calc-api:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USER }}/calc-api:test-latest
          docker push ${{ env.DOCKERHUB_USER }}/history-api:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USER }}/history-api:test-latest



  # ── open automated PR: test → prod ─────────────────────────────────────────
  open-pr:
    name: Open PR test → prod
    runs-on: ubuntu-latest
    needs: integration-test
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create PR test → prod
        run: |
          gh pr create \
            --base prod \
            --head test \
            --title "ci: promote test → prod (${{ env.IMAGE_TAG }})" \
            --body "Automated promotion from test. Images tagged ${{ env.IMAGE_TAG }}." \
            || echo "PR already exists or no diff — skipping"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
