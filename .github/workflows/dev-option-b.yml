name: Dev Pipeline — Option B

on:
  push:
    branches: [dev]
    paths:
      - 'optionB/**'
      - '.github/workflows/dev-option-b.yml'

concurrency:
  group: dev-pipeline-option-b
  cancel-in-progress: true

env:
  IMAGE_TAG: dev-${{ github.sha }}
  AWS_REGION: us-east-1

jobs:
  # ── secret scanning ───────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog — scan for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ── calc-api: dependency audit + unit tests ───────────────────────────────
  ci-calc:
    name: Test — calc-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
        working-directory: optionB/calc-api
      - name: Dependency audit
        run: npm audit --audit-level=high
        working-directory: optionB/calc-api
      - name: Unit tests with coverage
        run: npm test -- --coverage
        working-directory: optionB/calc-api

  # ── history-api: lint + dependency audit + unit tests ────────────────────
  ci-history:
    name: Lint & Test — history-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pip-audit pytest-cov
        working-directory: optionB/history-api
      - name: Lint
        run: flake8 app.py
        working-directory: optionB/history-api
      - name: Dependency audit
        run: pip-audit
        working-directory: optionB/history-api
      - name: Unit tests with coverage
        run: pytest --cov=. --cov-report=term-missing || [ $? -eq 5 ]
        working-directory: optionB/history-api

  # ── build images and push to ECR ─────────────────────────────────────────
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest
    needs: [ci-calc, ci-history, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./optionB/frontend
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/frontend:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/frontend:dev-latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build & push calc-api
        uses: docker/build-push-action@v5
        with:
          context: ./optionB/calc-api
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/calc-api:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/calc-api:dev-latest
          cache-from: type=gha,scope=calc-api
          cache-to: type=gha,scope=calc-api,mode=max
      - name: Build & push history-api
        uses: docker/build-push-action@v5
        with:
          context: ./optionB/history-api
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/history-api:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/history-api:dev-latest
          cache-from: type=gha,scope=history-api
          cache-to: type=gha,scope=history-api,mode=max

  # ── open automated PR: dev → test ─────────────────────────────────────────
  open-pr:
    name: Open PR dev → test
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create PR dev → test
        run: |
          gh pr create \
            --base test \
            --head dev \
            --title "ci: promote dev → test (${{ env.IMAGE_TAG }})" \
            --body "Automated promotion from dev. Images tagged ${{ env.IMAGE_TAG }}." \
            || echo "PR already exists or no diff — skipping"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
