name: Dev Pipeline

on:
  push:
    branches: [dev]

concurrency:
  group: dev-pipeline
  cancel-in-progress: true

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: dev-${{ github.sha }}

jobs:
  # ── secret scanning ───────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog — scan for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ── calc-api: dependency audit + unit tests ───────────────────────────────
  ci-calc:
    name: Test — calc-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: calc-api/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: calc-api
      - name: Dependency audit
        run: npm audit --audit-level=high
        working-directory: calc-api
      - name: Unit tests with coverage
        run: npm test -- --coverage
        working-directory: calc-api

  # ── history-api: lint + dependency audit + unit tests ────────────────────
  ci-history:
    name: Lint & Test — history-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: history-api/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt pip-audit pytest-cov
        working-directory: history-api
      - name: Lint
        run: flake8 app.py
        working-directory: history-api
      - name: Dependency audit
        run: pip-audit
        working-directory: history-api
      - name: Unit tests with coverage
        run: pytest --cov=. --cov-report=term-missing || [ $? -eq 5 ]
        working-directory: history-api

  # ── build images only after all CI jobs pass ──────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [ci-calc, ci-history, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/frontend:dev-latest
      - name: Build & push calc-api
        uses: docker/build-push-action@v5
        with:
          context: ./calc-api
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/calc-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/calc-api:dev-latest
      - name: Build & push history-api
        uses: docker/build-push-action@v5
        with:
          context: ./history-api
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/history-api:${{ env.IMAGE_TAG }}
            ${{ env.DOCKERHUB_USER }}/history-api:dev-latest

  # ── open automated PR: dev → test ─────────────────────────────────────────
  open-pr:
    name: Open PR dev → test
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create PR dev → test
        run: |
          gh pr create \
            --base test \
            --head dev \
            --title "ci: promote dev → test (${{ env.IMAGE_TAG }})" \
            --body "Automated promotion from dev. Images tagged ${{ env.IMAGE_TAG }}." \
            || echo "PR already exists or no diff — skipping"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
