<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <h1>Calculator</h1>
    <div id="display">0</div>
    <div class="buttons">
      <button class="btn-clear" onclick="clearCalc()">AC</button>
      <button class="btn-op" onclick="pressOperation('/')">÷</button>
      <button class="btn-op" onclick="pressOperation('*')">×</button>
      <button class="btn-op" onclick="pressOperation('-')">−</button>

      <button class="btn-number" onclick="pressDigit('7')">7</button>
      <button class="btn-number" onclick="pressDigit('8')">8</button>
      <button class="btn-number" onclick="pressDigit('9')">9</button>
      <button class="btn-op" onclick="pressOperation('+')">+</button>

      <button class="btn-number" onclick="pressDigit('4')">4</button>
      <button class="btn-number" onclick="pressDigit('5')">5</button>
      <button class="btn-number" onclick="pressDigit('6')">6</button>
      <button class="btn-eq" onclick="calculate()">=</button>

      <button class="btn-number" onclick="pressDigit('1')">1</button>
      <button class="btn-number" onclick="pressDigit('2')">2</button>
      <button class="btn-number" onclick="pressDigit('3')">3</button>

      <button class="btn-number btn-zero" onclick="pressDigit('0')">0</button>
      <button class="btn-number" onclick="pressDigit('.')">.</button>
    </div>
  </div>

  <div class="history-panel">
    <h2>History</h2>
    <ul id="history-list">
      <li class="empty">No history yet</li>
    </ul>
  </div>

  <div id="slot-badge"></div>
  <script src="env.js"></script>
  <script src="app.js"></script>
</body>
</html>
